[package]
name = "spherex-backend"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "SPHEREx sky time-lapse API (NASA Space Apps 2026)"

[lib]
name = "spherex_backend"
path = "src/lib.rs"

[[bin]]
name = "spherex-backend"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
ndarray = "0.16"
moka = { version = "0.12", features = ["future"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "compression-gzip", "trace", "timeout", "set-header"] }
tower_governor = "0.4"
base64 = "0.22"
rayon = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
futures-util = "0.3"
wiremock = "0.6"
http-body-util = "0.1"

# Release build tuning (task p1). `panic = "abort"` is deliberately
# absent: the test harness needs unwinding, so it cannot be combined
# with `cargo test --release`.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
