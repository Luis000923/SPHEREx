name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  detect:
    name: Detect backend presence
    runs-on: ubuntu-latest
    outputs:
      has_backend: ${{ steps.check.outputs.has_backend }}
    steps:
      - uses: actions/checkout@v4
      # Frontend-only branches carry no backend/ tree; gate the Rust,
      # supply-chain and Docker jobs so they are skipped instead of red.
      - id: check
        run: |
          if [ -f backend/Cargo.toml ]; then
            echo "has_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_backend=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend (fmt, clippy, test)
    needs: detect
    if: needs.detect.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  supply-chain:
    name: Supply chain (cargo deny)
    needs: detect
    if: needs.detect.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned major tag; no secrets required (advisories fetch the public
      # RustSec DB over https). Config: backend/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: backend/Cargo.toml
          command: check licenses advisories bans

  frontend:
    name: Frontend (typecheck, test, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx eslint .
      - run: npm run build

  docker:
    name: Docker image build + smoke (no push)
    needs: detect
    if: needs.detect.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t spherex-blink:ci .
      - run: scripts/docker-smoke.sh spherex-blink:ci
